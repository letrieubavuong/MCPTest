[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-question-studio"
version = "0.2.5"
description = "Windows desktop LaTeX question bank"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.1", "PyMuPDF==1.28.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]

[project.scripts]
latex-question-studio = "latex_question_studio.app.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
